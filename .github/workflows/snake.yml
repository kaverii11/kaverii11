name: Contribution snake + stats cards

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # Stats cards built here instead of the public github-readme-stats server (often down).
      # Runs before snk: snk's Docker step creates dist/ as root.
      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide=stars,issues&disable_animations=true&hide_border=true&bg_color=00000000&title_color=E07A5F&icon_color=81B29A&text_color=777777
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&exclude_repo=PMeBUSSEWA&hide=html,css,tex,scss&size_weight=0.5&count_weight=0.5&disable_animations=true&hide_border=true&bg_color=00000000&title_color=E07A5F&text_color=777777
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
